[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaspump"
version = "0.1.0"
description = "Streaming audit tool for one PumpApi archive hour"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31", "zstandard>=0.22", "pyarrow>=16.0", "duckdb>=1.1", "numpy>=1.26", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
